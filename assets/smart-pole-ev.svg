<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc">
  <title id="title">VoltGo solar smart pole charging an electric car</title>
  <desc id="desc">A clean side view of a silver electric car plugged into a solar smart pole, on a transparent background.</desc>
  <defs>
    <linearGradient id="solarGlass" x1="48" y1="36" x2="205" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33596d"/><stop offset="1" stop-color="#142f40"/>
    </linearGradient>
    <linearGradient id="poleMetal" x1="82" y1="88" x2="99" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7e1dc"/><stop offset=".18" stop-color="#82999b"/><stop offset=".48" stop-color="#405b64"/><stop offset=".72" stop-color="#263f49"/><stop offset=".9" stop-color="#92a8a7"/><stop offset="1" stop-color="#526c72"/>
    </linearGradient>
    <linearGradient id="unitFace" x1="70" y1="145" x2="112" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294957"/><stop offset="1" stop-color="#102b39"/>
    </linearGradient>
    <linearGradient id="paint" x1="157" y1="145" x2="350" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".42" stop-color="#e7eeee"/><stop offset=".78" stop-color="#c1cdcf"/><stop offset="1" stop-color="#8da1a5"/>
    </linearGradient>
    <linearGradient id="window" x1="200" y1="128" x2="294" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70aeb8"/><stop offset=".42" stop-color="#326b79"/><stop offset="1" stop-color="#193b49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Soft contact shadow; the surrounding background stays transparent. -->
  <ellipse cx="240" cy="232" rx="170" ry="10" fill="#16313c" opacity=".16" filter="url(#shadow)"/>
  <path d="M34 231h353" stroke="#789398" stroke-opacity=".25" stroke-width="1.2"/>

  <!-- Solar canopy and slim smart-pole mast. -->
  <path d="M85 76h9l5 142H80z" fill="#1a3039" opacity=".3" transform="translate(2 2)"/>
  <path d="M84 76h9l5 142H79z" fill="url(#poleMetal)" stroke="#526b70" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m86 82 2 48m1 73 1 10" stroke="#f4f8ef" stroke-opacity=".56" stroke-width="1.6" stroke-linecap="round"/>
  <path d="m81 121 15 1m-14 5 15 1" stroke="#d9e5de" stroke-opacity=".32" stroke-width="1"/>
  <path d="m78 215 22 1 5 7-32-1z" fill="#5d767a" stroke="#9aacab" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m76 221 31 1 4 4-39-1z" fill="#324c55" stroke="#748a8c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M89 81V72l14-9" fill="none" stroke="#637d83" stroke-width="5" stroke-linecap="round"/>
  <path d="M89 81V72l14-9" fill="none" stroke="#c2d0ca" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
  <path d="m24 45 163-31 50 59-165 34z" fill="#47723d" opacity=".22" transform="translate(0 4)"/>
  <path d="m25 41 162-31 50 59-165 34z" fill="#7fba51" stroke="#a5d873" stroke-width="2" stroke-linejoin="round"/>
  <path d="m37 44 145-28 39 48-148 30z" fill="url(#solarGlass)" stroke="#eff8df" stroke-width="2" stroke-linejoin="round"/>
  <g fill="none" stroke="#d9e9e4" stroke-opacity=".8" stroke-width="1">
    <path d="m42 55 146-28m-135 43 146-28m-134 43 146-28"/>
    <path d="m70 38 35 49m25-60 35 49m-89-30 35 49m25-60 35 49"/>
  </g>
  <path d="m44 45 136-26" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  <path d="m75 96 14 3v12l-14-3z" fill="#788f91"/>

  <!-- Charger module mounted directly to the pole. -->
  <path d="m67 143 8-4 39 3v55l-8 4-39-4z" fill="#0c2633" opacity=".22" transform="translate(2 3)"/>
  <path d="m67 141 8-4 39 3v55l-8 4-39-4z" fill="url(#unitFace)" stroke="#4f727a" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m75 137 39 3v55l-39-4z" fill="#244451" stroke="#78969a" stroke-width="1"/>
  <circle cx="95" cy="151" r="8" fill="#79b74e"/>
  <path d="m97 145-5 7h4l-2 6 7-8h-4l2-5z" fill="#f8ffed"/>
  <rect x="83" y="164" width="22" height="14" rx="2" fill="#071820" stroke="#58b8b0" stroke-opacity=".7"/>
  <circle cx="87" cy="168" r="1.5" fill="#a8e778"/>
  <path d="M91 168h10M86 172h15" stroke="#a6c8c7" stroke-opacity=".75" stroke-width="1"/>
  <rect x="107" y="169" width="5" height="10" rx="1.5" fill="#071820" stroke="#a8df70" stroke-width="1"/>
  <path d="m62 197 53 4-6 7-52-4z" fill="#344f59" stroke="#81989a" stroke-width="1"/>

  <!-- Recognizable compact EV in side view. -->
  <path d="M143 190c3-8 8-14 16-18l23-8 19-24c6-8 15-12 27-13l39-1c14 0 24 5 34 15l22 23 26 5c10 2 17 9 20 18l3 16c1 7-4 12-13 14l-23 4H158c-13 0-21-5-22-14l1-10c1-3 3-6 6-7z" fill="url(#paint)" stroke="#7f999d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Greenhouse, rear window, and pillars -->
  <path d="m190 162 18-21c5-6 12-9 21-10l37-1c9 0 17 4 24 11l17 19-7 5H185z" fill="url(#window)" stroke="#8daeb2" stroke-width="2" stroke-linejoin="round"/>
  <path d="m257 131-1 35m-42-35 13 35m50-24 17 22" fill="none" stroke="#d8e4e1" stroke-width="3"/>
  <path d="m204 135 40-2" stroke="#d8f7f2" stroke-opacity=".45" stroke-width="2"/>
  <!-- Hood, clean door seams and handles -->
  <path d="m146 187 34-6 8-12m-1 29 112 1m-75-33-2 32m53-34 5 34" fill="none" stroke="#93a6a8" stroke-width="1.5"/>
  <path d="m236 177 12-1m40 1 12 1" stroke="#718b90" stroke-width="2" stroke-linecap="round"/>
  <path d="m146 181 15-3 3 5-16 4z" fill="#d9fff0" stroke="#96aaa9" stroke-width="1"/>
  <path d="m350 173 13 4 3 8-14-3z" fill="#e57d76" stroke="#f0b2a6" stroke-width="1"/>
  <path d="m207 203 112 1" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>

  <!-- Wheels with restrained alloy detail. -->
  <g>
    <circle cx="190" cy="207" r="20" fill="#1c3038" stroke="#91a4a5" stroke-width="2"/>
    <circle cx="190" cy="207" r="12" fill="#d4dddd" stroke="#748d91" stroke-width="2"/>
    <circle cx="190" cy="207" r="6" fill="#526d74"/>
    <path d="M190 196v5m0 12v5m-11-11h5m12 0h5m-19-8 4 4m8 8 4 4m0-16-4 4m-8 8-4 4" stroke="#f4f7f2" stroke-width="1.5"/>
    <circle cx="332" cy="207" r="19" fill="#1c3038" stroke="#91a4a5" stroke-width="2"/>
    <circle cx="332" cy="207" r="11" fill="#d4dddd" stroke="#748d91" stroke-width="2"/>
    <circle cx="332" cy="207" r="5.5" fill="#526d74"/>
    <path d="M332 197v4m0 12v4m-10-10h4m12 0h4m-17-7 4 4m7 7 4 4m0-15-4 4m-7 7-4 4" stroke="#f4f7f2" stroke-width="1.4"/>
  </g>

  <!-- One continuous charging cable, from the pole socket to the car inlet. -->
  <path d="M109 174c8 7 9 19 4 29-5 10-13 16-12 22 1 7 13 8 28 8 19 0 31-6 34-17 3-10-2-18 2-28" fill="none" stroke="#163b32" stroke-width="7" stroke-linecap="round"/>
  <path d="M109 174c8 7 9 19 4 29-5 10-13 16-12 22 1 7 13 8 28 8 19 0 31-6 34-17 3-10-2-18 2-28" fill="none" stroke="#a7df68" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M109 174c8 7 9 19 4 29-5 10-13 16-12 22 1 7 13 8 28 8 19 0 31-6 34-17 3-10-2-18 2-28" fill="none" stroke="#d8f6a1" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>
  <rect x="159" y="180" width="13" height="9" rx="3" transform="rotate(-20 159 180)" fill="#25434a" stroke="#a7df68" stroke-width="1.3"/>
  <path d="m165 181 6-2" stroke="#e4f7bd" stroke-width="1.2"/>
</svg>
